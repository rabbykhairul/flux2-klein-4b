name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The baked image is ~48 GB; free the runner's preinstalled tooling and move
      # Docker storage to the larger /mnt disk so the build doesn't run out of space.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: true
          docker-images: true

      # BuildKit stages cache blobs under TMPDIR, which defaults to /tmp on the small root
      # filesystem — moving Docker's data-root alone does not cover it. Both cold builds of
      # this repo died with "No space left on device" on a root path while /mnt sat mostly
      # empty, and the runner filled up hard enough that it could not upload its own logs.
      - name: Move Docker storage and temp to /mnt
        run: |
          sudo mkdir -p /mnt/docker /mnt/tmp
          sudo chmod 1777 /mnt/tmp
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"

      - name: Disk before build
        run: df -h / /mnt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          provenance: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          # mode=min, not max. mode=max stages and uploads every intermediate layer, which on
          # a cold build means the whole torch and ComfyUI chain on top of the final image.
          # The production repo tolerates max only because its cache-from hits and those
          # layers are pulled rather than rebuilt; a repo with no cache yet has to materialise
          # all of them at once. min exports just the final image's layers and still gives
          # subsequent builds their reuse.
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=min
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Disk after build
        if: always()
        run: df -h / /mnt
