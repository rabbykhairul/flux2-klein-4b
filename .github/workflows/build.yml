name: Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ~22 GB image against a ~14 GB runner disk, so both the tool-cache reclaim and the
      # move to /mnt are load-bearing. Swap stays: reclaiming it leaves the weight bake with
      # no headroom past physical RAM, which is what OOM'd the sibling Qwen worker's build.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true
          swap-storage: false
          docker-images: true

      # BuildKit also stages cache blobs under TMPDIR, which defaults to /tmp on the small
      # root filesystem — this repo's predecessor died with "No space left on device" on a
      # root path while /mnt sat mostly empty. Both have to move, not just Docker.
      - name: Move Docker storage and temp to /mnt
        run: |
          sudo mkdir -p /mnt/docker /mnt/tmp
          sudo chmod 1777 /mnt/tmp
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          echo "TMPDIR=/mnt/tmp" >> "$GITHUB_ENV"

      - name: Disk before build
        run: df -h / /mnt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          # mode=min, not max. max stages and uploads every intermediate layer, and on a cold
          # cache that is what fills the runner rather than the image itself.
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=min
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Disk after build
        if: always()
        run: df -h / /mnt
